name: Deploy Pages

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
    inputs:
      version:
        description: Release version expected in the published Sparkle feed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build GitHub Pages
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out published metadata
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Build site with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify published Sparkle feed
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          VERSION: ${{ inputs.version || github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail

          APPCAST_URL="${PAGE_URL%/}/appcast.xml"
          for _ in {1..12}; do
            if curl --fail --silent --show-error \
              --output "$RUNNER_TEMP/published-appcast.xml" \
              "$APPCAST_URL" \
              && grep -Fq \
                "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" \
                "$RUNNER_TEMP/published-appcast.xml"; then
              exit 0
            fi
            sleep 5
          done

          echo "Published appcast does not contain version $VERSION" >&2
          exit 1
