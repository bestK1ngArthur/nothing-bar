name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    environment: release
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ vars.APPLE_API_ISSUER_ID }}
      APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tag
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release configuration
        shell: bash
        run: |
          set -euo pipefail

          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID variable in the release environment}"
          : "${APPLE_API_KEY_ID:?Set the APPLE_API_KEY_ID variable in the release environment}"
          : "${APPLE_API_ISSUER_ID:?Set the APPLE_API_ISSUER_ID variable in the release environment}"
          : "${APPLE_SIGNING_IDENTITY:?Set the APPLE_SIGNING_IDENTITY variable in the release environment}"

      - name: Validate tag source
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$GITHUB_REF_NAME"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a semantic version tag such as 2.12.0, got: $VERSION" >&2
            exit 1
          fi

          git fetch --no-tags origin \
            "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "The tagged commit must be part of $DEFAULT_BRANCH" >&2
            exit 1
          fi

          PUB_DATE="$(git show -s --format=%cD "$GITHUB_SHA")"
          ASSET_NAME="nothing-bar-$VERSION.zip"

          {
            echo "VERSION=$VERSION"
            echo "PUB_DATE=$PUB_DATE"
            echo "ASSET_NAME=$ASSET_NAME"
            echo "ASSET_PATH=$RUNNER_TEMP/$ASSET_NAME"
            echo "SOURCE_PACKAGES_PATH=$RUNNER_TEMP/SourcePackages"
            echo "ARCHIVE_PATH=$RUNNER_TEMP/NothingBar.xcarchive"
            echo "EXPORT_PATH=$RUNNER_TEMP/Export"
            echo "APP_PATH=$RUNNER_TEMP/Export/NothingBar.app"
          } >> "$GITHUB_ENV"

      - name: Resolve package dependencies
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild -resolvePackageDependencies \
            -project NothingBar.xcodeproj \
            -scheme NothingBar \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH"

          SIGN_UPDATE="$SOURCE_PACKAGES_PATH/artifacts/sparkle/Sparkle/bin/sign_update"
          if [[ ! -x "$SIGN_UPDATE" ]]; then
            echo "Sparkle sign_update was not found at $SIGN_UPDATE" >&2
            exit 1
          fi

          echo "SIGN_UPDATE=$SIGN_UPDATE" >> "$GITHUB_ENV"

      - name: Validate project version
        shell: bash
        run: |
          set -euo pipefail

          BUILD_SETTINGS="$RUNNER_TEMP/build-settings.txt"
          xcodebuild -showBuildSettings \
            -project NothingBar.xcodeproj \
            -scheme NothingBar \
            -configuration Release \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            > "$BUILD_SETTINGS"

          PROJECT_VERSION="$(awk -F ' = ' '/ MARKETING_VERSION = / { print $2; exit }' "$BUILD_SETTINGS")"
          BUILD_NUMBER="$(awk -F ' = ' '/ CURRENT_PROJECT_VERSION = / { print $2; exit }' "$BUILD_SETTINGS")"

          if [[ "$PROJECT_VERSION" != "$VERSION" ]]; then
            echo "Tag $VERSION does not match MARKETING_VERSION $PROJECT_VERSION" >&2
            exit 1
          fi

          if [[ ! "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "CURRENT_PROJECT_VERSION must be a positive integer, got: $BUILD_NUMBER" >&2
            exit 1
          fi

          LATEST_BUILD="$(python3 - <<'PY'
          import xml.etree.ElementTree as ET

          namespace = {"sparkle": "http://www.andymatuschak.org/xml-namespaces/sparkle"}
          root = ET.parse("docs/appcast.xml").getroot()
          builds = [
              int(value)
              for value in (
                  item.findtext("sparkle:version", namespaces=namespace)
                  for item in root.findall("./channel/item")
              )
              if value and value.isdigit()
          ]
          print(max(builds, default=0))
          PY
          )"

          if (( BUILD_NUMBER <= LATEST_BUILD )); then
            echo "CURRENT_PROJECT_VERSION $BUILD_NUMBER must be greater than appcast build $LATEST_BUILD" >&2
            exit 1
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        shell: bash
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail

          : "${DEVELOPER_ID_P12_BASE64:?Set the DEVELOPER_ID_P12_BASE64 secret}"
          : "${DEVELOPER_ID_P12_PASSWORD:?Set the DEVELOPER_ID_P12_PASSWORD secret}"

          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"

          printf '%s' "$DEVELOPER_ID_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          if ! security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -Fq "$APPLE_SIGNING_IDENTITY"; then
            echo "$APPLE_SIGNING_IDENTITY identity was not imported" >&2
            exit 1
          fi

      - name: Archive and export app
        shell: bash
        run: |
          set -euo pipefail

          xcodebuild archive \
            -project NothingBar.xcodeproj \
            -scheme NothingBar \
            -configuration Release \
            -destination "generic/platform=macOS" \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$SOURCE_PACKAGES_PATH" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$APPLE_SIGNING_IDENTITY" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$EXPORT_OPTIONS"
          plutil -insert method -string developer-id "$EXPORT_OPTIONS"
          plutil -insert signingStyle -string manual "$EXPORT_OPTIONS"
          plutil -insert signingCertificate -string "$APPLE_SIGNING_IDENTITY" "$EXPORT_OPTIONS"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$EXPORT_OPTIONS"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS"

          test -d "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          EXPORTED_VERSION="$(plutil -extract CFBundleShortVersionString raw "$APP_PATH/Contents/Info.plist")"
          EXPORTED_BUILD="$(plutil -extract CFBundleVersion raw "$APP_PATH/Contents/Info.plist")"
          if [[ "$EXPORTED_VERSION" != "$VERSION" || "$EXPORTED_BUILD" != "$BUILD_NUMBER" ]]; then
            echo "Exported version $EXPORTED_VERSION ($EXPORTED_BUILD) does not match $VERSION ($BUILD_NUMBER)" >&2
            exit 1
          fi

          MINIMUM_SYSTEM_VERSION="$(plutil -extract LSMinimumSystemVersion raw "$APP_PATH/Contents/Info.plist")"
          SPARKLE_FEED_URL="$(plutil -extract SUFeedURL raw "$APP_PATH/Contents/Info.plist")"
          if [[ "$SPARKLE_FEED_URL" != */appcast.xml ]]; then
            echo "SUFeedURL must end with /appcast.xml, got: $SPARKLE_FEED_URL" >&2
            exit 1
          fi

          {
            echo "MINIMUM_SYSTEM_VERSION=$MINIMUM_SYSTEM_VERSION"
            echo "SPARKLE_FEED_URL=$SPARKLE_FEED_URL"
            echo "SPARKLE_RELEASE_NOTES_BASE_URL=${SPARKLE_FEED_URL%/appcast.xml}/releases"
          } >> "$GITHUB_ENV"

      - name: Notarize and package app
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail

          : "${APPLE_API_PRIVATE_KEY_BASE64:?Set the APPLE_API_PRIVATE_KEY_BASE64 secret}"

          API_KEY_PATH="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          NOTARIZATION_ARCHIVE="$RUNNER_TEMP/notarization.zip"

          printf '%s' "$APPLE_API_PRIVATE_KEY_BASE64" | base64 -D > "$API_KEY_PATH"
          chmod 600 "$API_KEY_PATH"

          ditto -c -k --keepParent "$APP_PATH" "$NOTARIZATION_ARCHIVE"
          xcrun notarytool submit "$NOTARIZATION_ARCHIVE" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait \
            --timeout 30m

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

          ditto -c -k --keepParent "$APP_PATH" "$ASSET_PATH"

          python3 - <<'PY'
          import os
          import zipfile

          with zipfile.ZipFile(os.environ["ASSET_PATH"]) as archive:
              names = archive.namelist()

          if not names or any(not name.startswith("NothingBar.app/") for name in names):
              raise SystemExit("Release ZIP must contain only NothingBar.app")
          PY

      - name: Sign Sparkle update
        shell: bash
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          : "${SPARKLE_PRIVATE_KEY:?Set the SPARKLE_PRIVATE_KEY secret}"

          BUNDLED_PUBLIC_KEY="$(plutil -extract SUPublicEDKey raw "$APP_PATH/Contents/Info.plist")"
          DERIVED_PUBLIC_KEY="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | xcrun swift -e '
          import CryptoKit
          import Foundation

          let input = FileHandle.standardInput.readDataToEndOfFile()
          guard let text = String(data: input, encoding: .utf8) else {
              fatalError("Sparkle private key is not UTF-8")
          }
          let encodedSeed = text.trimmingCharacters(in: .whitespacesAndNewlines)
          guard let seed = Data(base64Encoded: encodedSeed), seed.count == 32 else {
              fatalError("Sparkle private key must be a base64-encoded 32-byte seed")
          }
          let privateKey = try Curve25519.Signing.PrivateKey(rawRepresentation: seed)
          print(privateKey.publicKey.rawRepresentation.base64EncodedString())
          ')"

          if [[ "$DERIVED_PUBLIC_KEY" != "$BUNDLED_PUBLIC_KEY" ]]; then
            echo "SPARKLE_PRIVATE_KEY does not match the app's SUPublicEDKey" >&2
            exit 1
          fi

          SIGNATURE_OUTPUT="$RUNNER_TEMP/sparkle-signature.txt"
          printf '%s' "$SPARKLE_PRIVATE_KEY" \
            | "$SIGN_UPDATE" --ed-key-file - "$ASSET_PATH" \
            > "$SIGNATURE_OUTPUT"

          SHA256="$(shasum -a 256 "$ASSET_PATH" | awk '{ print $1 }')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"

          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import re

          output_path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "sparkle-signature.txt"
          output = output_path.read_text(encoding="utf-8")
          match = re.fullmatch(
              r'sparkle:edSignature="([A-Za-z0-9+/]+={0,2})" length="([0-9]+)"\s*',
              output,
          )
          if match is None:
              raise SystemExit(f"Unexpected sign_update output: {output!r}")

          signature, reported_length = match.groups()
          if len(base64.b64decode(signature, validate=True)) != 64:
              raise SystemExit("Sparkle signature is not a 64-byte Ed25519 signature")

          actual_length = pathlib.Path(os.environ["ASSET_PATH"]).stat().st_size
          if int(reported_length) != actual_length:
              raise SystemExit("sign_update reported an incorrect asset length")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as environment:
              environment.write(f"SPARKLE_SIGNATURE={signature}\n")
              environment.write(f"ASSET_LENGTH={actual_length}\n")
          PY

      - name: Create draft GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if RELEASE_JSON="$(gh release view "$VERSION" --json isDraft,isImmutable,assets 2>/dev/null)"; then
            IS_DRAFT="$(jq -r '.isDraft' <<< "$RELEASE_JSON")"
            REMOTE_DIGEST="$(jq -r --arg name "$ASSET_NAME" '.assets[] | select(.name == $name) | .digest // empty' <<< "$RELEASE_JSON")"

            if [[ -n "$REMOTE_DIGEST" && "$REMOTE_DIGEST" != "sha256:$SHA256" ]]; then
              echo "Release asset $ASSET_NAME already exists with a different digest" >&2
              exit 1
            fi

            if [[ "$IS_DRAFT" != "true" && -z "$REMOTE_DIGEST" ]]; then
              echo "Published release $VERSION is missing $ASSET_NAME" >&2
              exit 1
            fi

            if [[ "$IS_DRAFT" == "true" && -z "$REMOTE_DIGEST" ]]; then
              gh release upload "$VERSION" "$ASSET_PATH"
            fi
          else
            gh release create "$VERSION" "$ASSET_PATH" \
              --draft \
              --generate-notes \
              --title "$VERSION" \
              --verify-tag
          fi

          gh release view "$VERSION" --json body --jq '.body' > "$RUNNER_TEMP/release-notes.md"
          jq -n \
            --rawfile text "$RUNNER_TEMP/release-notes.md" \
            --arg context "$GITHUB_REPOSITORY" \
            '{ text: $text, mode: "gfm", context: $context }' \
            | gh api --method POST markdown --input - \
            > "$RUNNER_TEMP/release-notes.html"

      - name: Update Cask and Sparkle appcast
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin \
            "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git switch --force-create release-metadata "origin/$DEFAULT_BRANCH"

          python3 - <<'PY'
          import os
          import pathlib
          import re
          import xml.etree.ElementTree as ET
          from html import escape
          from xml.sax.saxutils import quoteattr

          version = os.environ["VERSION"]
          build = os.environ["BUILD_NUMBER"]
          sha256 = os.environ["SHA256"]
          signature = os.environ["SPARKLE_SIGNATURE"]
          length = os.environ["ASSET_LENGTH"]
          pub_date = os.environ["PUB_DATE"]
          repository = os.environ["GITHUB_REPOSITORY"]
          minimum_system_version = os.environ["MINIMUM_SYSTEM_VERSION"]
          release_notes_base_url = os.environ["SPARKLE_RELEASE_NOTES_BASE_URL"]

          cask_path = pathlib.Path("Casks/nothingbar.rb")
          cask = cask_path.read_text(encoding="utf-8")
          cask, version_count = re.subn(
              r'^  version "[^"]+"$',
              f'  version "{version}"',
              cask,
              count=1,
              flags=re.MULTILINE,
          )
          cask, sha_count = re.subn(
              r'^  sha256 "[0-9a-f]{64}"$',
              f'  sha256 "{sha256}"',
              cask,
              count=1,
              flags=re.MULTILINE,
          )
          if version_count != 1 or sha_count != 1:
              raise SystemExit("Could not update the Homebrew Cask")
          cask_path.write_text(cask, encoding="utf-8")

          namespace_uri = "http://www.andymatuschak.org/xml-namespaces/sparkle"
          namespace = {"sparkle": namespace_uri}
          appcast_path = pathlib.Path("docs/appcast.xml")
          appcast = appcast_path.read_text(encoding="utf-8")
          root = ET.fromstring(appcast)
          channel = root.find("channel")
          if channel is None:
              raise SystemExit("appcast.xml has no channel")

          release_url = f"https://github.com/{repository}/releases/download/{version}/nothing-bar-{version}.zip"
          release_notes_url = f"{release_notes_base_url}/{version}.html"
          matching_items = [
              item
              for item in channel.findall("item")
              if item.findtext("sparkle:shortVersionString", namespaces=namespace) == version
          ]

          if len(matching_items) > 1:
              raise SystemExit(f"appcast.xml contains duplicate entries for {version}")

          if matching_items:
              item = matching_items[0]
              enclosure = item.find("enclosure")
              expected = {
                  "build": build,
                  "url": release_url,
                  "length": length,
                  "signature": signature,
              }
              actual = {
                  "build": item.findtext("sparkle:version", namespaces=namespace),
                  "url": enclosure.get("url") if enclosure is not None else None,
                  "length": enclosure.get("length") if enclosure is not None else None,
                  "signature": enclosure.get(f"{{{namespace_uri}}}edSignature") if enclosure is not None else None,
              }
              if actual != expected:
                  raise SystemExit(f"Existing appcast entry does not match this build: {actual!r}")
          else:
              marker = "        <title>NothingBar</title>\n"
              if appcast.count(marker) != 1:
                  raise SystemExit("Could not find the unique appcast insertion point")

              item = (
                  "        <item>\n"
                  f"            <title>{escape(version)}</title>\n"
                  f"            <pubDate>{escape(pub_date)}</pubDate>\n"
                  f"            <sparkle:version>{escape(build)}</sparkle:version>\n"
                  f"            <sparkle:shortVersionString>{escape(version)}</sparkle:shortVersionString>\n"
                  f"            <sparkle:minimumSystemVersion>{escape(minimum_system_version)}</sparkle:minimumSystemVersion>\n"
                  f"            <sparkle:releaseNotesLink>{escape(release_notes_url)}</sparkle:releaseNotesLink>\n"
                  f"            <enclosure url={quoteattr(release_url)} length={quoteattr(length)} "
                  f"type=\"application/octet-stream\" sparkle:edSignature={quoteattr(signature)}/>\n"
                  "        </item>\n"
              )
              appcast = appcast.replace(marker, marker + item, 1)
              appcast_path.write_text(appcast, encoding="utf-8")

          updated_root = ET.parse(appcast_path).getroot()
          updated_items = updated_root.findall("./channel/item")
          builds = [
              int(item.findtext("sparkle:version", namespaces=namespace))
              for item in updated_items
          ]
          if len(builds) != len(set(builds)) or builds != sorted(builds, reverse=True):
              raise SystemExit("Sparkle build numbers must be unique and descending")

          notes_fragment = (
              pathlib.Path(os.environ["RUNNER_TEMP"]) / "release-notes.html"
          ).read_text(encoding="utf-8").strip()
          notes_path = pathlib.Path("docs/releases") / f"{version}.html"
          notes_path.write_text(
              f"<h1>NothingBar {escape(version)}</h1>\n{notes_fragment}\n",
              encoding="utf-8",
          )
          PY

          ruby -c Casks/nothingbar.rb
          python3 -c 'import xml.etree.ElementTree as ET; ET.parse("docs/appcast.xml")'
          git diff --check

      - name: Commit release metadata
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Casks/nothingbar.rb docs/appcast.xml "docs/releases/$VERSION.html"

          if git diff --cached --quiet; then
            echo "Release metadata is already up to date"
            exit 0
          fi

          git commit -m "Update release metadata for $VERSION"
          git pull --rebase origin "$DEFAULT_BRANCH"
          git push origin "HEAD:$DEFAULT_BRANCH"

      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$(gh release view "$VERSION" --json isDraft --jq '.isDraft')" == "true" ]]; then
            gh release edit "$VERSION" --draft=false --latest
          fi

      - name: Publish Sparkle feed with GitHub Pages
        shell: bash
        run: |
          set -euo pipefail

          BUILD_URL="$(gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --jq '.url')"
          BUILD_ID="${BUILD_URL##*/}"

          for _ in {1..60}; do
            STATUS="$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/$BUILD_ID" --jq '.status')"
            case "$STATUS" in
              built)
                for _ in {1..30}; do
                  curl --fail --silent --show-error \
                    --output "$RUNNER_TEMP/published-appcast.xml" \
                    "$SPARKLE_FEED_URL"
                  if grep -Fq \
                    "<sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>" \
                    "$RUNNER_TEMP/published-appcast.xml"; then
                    exit 0
                  fi
                  sleep 5
                done
                echo "GitHub Pages built successfully, but the published appcast is stale" >&2
                exit 1
                ;;
              errored)
                echo "GitHub Pages build failed" >&2
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for GitHub Pages build" >&2
          exit 1

      - name: Clean up signing material
        if: ${{ always() }}
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/developer-id.p12" \
            "$RUNNER_TEMP"/AuthKey_*.p8
